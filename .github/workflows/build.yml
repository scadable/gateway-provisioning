# gateway-provisioning CI
# SCADABLE 2026 · Apache-2.0
#
# Builds the ESP-IDF firmware on every push and PR. Matrix covers
# ESP32-classic and ESP32-S3 — those are the two chips the SCADABLE
# dashboard supports today. Add new entries here when the dashboard
# adds a new target.
#
# On tag pushes (e.g. v0.1.0) the firmware binary is also attached to
# the GitHub release for SCADABLE engineers to grab into the
# web-flasher manifest.

name: build

on:
  push:
    branches: [main]
    paths:
      - 'esp/**'
      - '.github/workflows/build.yml'
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'esp/**'
      - '.github/workflows/build.yml'

permissions:
  contents: write   # for release-asset upload on tag push

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [esp32, esp32s3]

    steps:
      - uses: actions/checkout@v4

      - name: Build with ESP-IDF
        # Espressif's official action installs the toolchain and runs
        # `idf.py build` inside a Docker image pinned to the requested
        # IDF version. v5.1+ matches our `idf_component.yml` floor.
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3
          target: ${{ matrix.target }}
          path: 'esp'

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: gateway-provisioning-${{ matrix.target }}
          path: |
            esp/build/gateway-provisioning.bin
            esp/build/bootloader/bootloader.bin
            esp/build/partition_table/partition-table.bin
          if-no-files-found: error

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            esp/build/gateway-provisioning.bin
            esp/build/bootloader/bootloader.bin
            esp/build/partition_table/partition-table.bin
          fail_on_unmatched_files: true
