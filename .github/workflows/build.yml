# gateway-provisioning CI
# SCADABLE 2026 · Apache-2.0
#
# Builds the ESP-IDF firmware on every push and PR. Matrix covers the
# product of {chip target} × {flash size}, because most ESP32 dev
# boards in the wild are 4 MiB while the products SCADABLE ships are
# typically 8 MiB. One source tree, four binaries, no in-the-field
# bootloader-panic on a small chip.
#
# On tag pushes (e.g. v0.1.4) the firmware binaries are renamed with
# a `<target>-<flash_size>` prefix (so esp32-4mb + esp32-8mb +
# esp32s3-4mb + esp32s3-8mb don't overwrite each other on the release
# page), then attached to the GitHub release. A follow-up `manifest`
# job assembles the esptool-js install manifest the dashboard's
# WebSerial flasher expects — the dashboard picks the matching build
# from the manifest based on the chip + flash size it probes from the
# connected device.
#
# Add new entries to the matrix when the dashboard adds a new target
# or a new flash-size SKU.

name: build

on:
  push:
    branches: [main]
    paths:
      - 'esp/**'
      - '.github/workflows/build.yml'
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'esp/**'
      - '.github/workflows/build.yml'

permissions:
  contents: write   # for release-asset upload on tag push

jobs:
  build:
    name: build (${{ matrix.target }}-${{ matrix.flash_size }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [esp32, esp32s3]
        flash_size: [4mb, 8mb]

    steps:
      - uses: actions/checkout@v4

      - name: Build with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3
          target: ${{ matrix.target }}
          path: 'esp'
          # Layered defaults: common base + size overlay. ESP-IDF reads
          # these in order, later wins. The size overlay is what flips
          # CONFIG_PARTITION_TABLE_CUSTOM_FILENAME and
          # CONFIG_ESPTOOLPY_FLASHSIZE_<N>MB so the same source tree
          # produces a 4 MiB-safe binary or an 8 MiB binary depending
          # on the matrix axis.
          #
          # NB: the action's docker invocation does NOT propagate
          # arbitrary workflow `env:` vars into the container — only
          # IDF_TARGET makes it through. So SDKCONFIG_DEFAULTS has to
          # be set inline in the `command:` shell, not the step env.
          # See https://github.com/espressif/esp-idf-ci-action/blob/main/action.yml
          command: SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.${{ matrix.flash_size }}" idf.py build

      - name: Rename outputs with target+flash-size prefix
        run: |
          mkdir -p out
          PREFIX="${{ matrix.target }}-${{ matrix.flash_size }}"
          cp esp/build/gateway-provisioning.bin            "out/${PREFIX}-app.bin"
          cp esp/build/bootloader/bootloader.bin           "out/${PREFIX}-bootloader.bin"
          cp esp/build/partition_table/partition-table.bin "out/${PREFIX}-partition-table.bin"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: bins-${{ matrix.target }}-${{ matrix.flash_size }}
          path: out/*
          if-no-files-found: error

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          fail_on_unmatched_files: true

  manifest:
    name: manifest.json
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Write manifest.json
        # esptool-js install manifest. `chipFamily` is the device
        # property the WebSerial flasher reads from the connected
        # board; `flashSize` lets the dashboard disambiguate which
        # build to pick after probing the SPI flash size on connect.
        # Bootloader offset on ESP32 is 0x1000 (4096); on ESP32-S3 it
        # is 0x0 (the ROM bootloader expects the second-stage
        # bootloader at offset 0). Partition table is at
        # CONFIG_PARTITION_TABLE_OFFSET=0x8000 (32768) on both;
        # application starts at 0x20000 (131072) per partitions_*.csv.
        run: |
          cat > manifest.json <<EOF
          {
            "name": "scadable-gateway-provisioning",
            "version": "${{ github.ref_name }}",
            "builds": [
              {
                "chipFamily": "ESP32",
                "flashSize": "4MB",
                "parts": [
                  { "path": "esp32-4mb-bootloader.bin",       "offset": 4096   },
                  { "path": "esp32-4mb-partition-table.bin",  "offset": 32768  },
                  { "path": "esp32-4mb-app.bin",              "offset": 131072 }
                ]
              },
              {
                "chipFamily": "ESP32",
                "flashSize": "8MB",
                "parts": [
                  { "path": "esp32-8mb-bootloader.bin",       "offset": 4096   },
                  { "path": "esp32-8mb-partition-table.bin",  "offset": 32768  },
                  { "path": "esp32-8mb-app.bin",              "offset": 131072 }
                ]
              },
              {
                "chipFamily": "ESP32-S3",
                "flashSize": "4MB",
                "parts": [
                  { "path": "esp32s3-4mb-bootloader.bin",       "offset": 0      },
                  { "path": "esp32s3-4mb-partition-table.bin",  "offset": 32768  },
                  { "path": "esp32s3-4mb-app.bin",              "offset": 131072 }
                ]
              },
              {
                "chipFamily": "ESP32-S3",
                "flashSize": "8MB",
                "parts": [
                  { "path": "esp32s3-8mb-bootloader.bin",       "offset": 0      },
                  { "path": "esp32s3-8mb-partition-table.bin",  "offset": 32768  },
                  { "path": "esp32s3-8mb-app.bin",              "offset": 131072 }
                ]
              }
            ]
          }
          EOF
          cat manifest.json

      - name: Attach manifest to release
        uses: softprops/action-gh-release@v2
        with:
          files: manifest.json
          fail_on_unmatched_files: true
